[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmflow"
version = "0.1.0"
description = "Provider-agnostic LLM gateway with cost-aware routing"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pyyaml>=6",
  "python-dotenv>=1",
  "cryptography>=43",
  "argon2-cffi>=23",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
examples = ["openai>=1.0"]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501", "C408"]
"scripts/*" = ["S311", "E501"]
"src/llmflow/bench/*" = ["E501", "S311"]
"src/llmflow/tools/*" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
